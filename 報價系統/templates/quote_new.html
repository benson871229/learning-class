{% extends "base.html" %}
{% block title %}開立報價單{% endblock %}
{% block content %}
<h3 class="fw-black mb-4"><i class="bi bi-file-earmark-plus me-2"></i>開立報價單</h3>
<form method="post">
  <!-- 學生 -->
  <div class="card shadow-sm rounded-4 mb-4">
    <div class="card-body p-4">
      <h6 class="fw-bold mb-3">學生資料</h6>
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label fw-bold small">從名冊選擇</label>
          <select id="student-select" class="form-select rounded-3" onchange="pickStudent()">
            <option value="">─ 手動輸入 / 未建檔 ─</option>
            {% for s in students %}
            <option value="{{ s.id }}" data-name="{{ s.name }}">{{ s.name }}{% if s.grade %}（{{ s.grade }}）{% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small">學生姓名 <span class="text-danger">*</span></label>
          <input name="student_name" id="student-name" class="form-control rounded-3" required>
        </div>
        <input type="hidden" name="student_id" id="student-id">
        <div class="col-md-3">
          <label class="form-label fw-bold small">開立日期</label>
          <input name="issue_date" class="form-control rounded-3" value="{{ today }}">
        </div>
      </div>
    </div>
  </div>

  <!-- 課程 -->
  <div class="card shadow-sm rounded-4 mb-4">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0">課程明細</h6>
        <small class="text-secondary">總計 = 學費 + 教材費 − 扣除金額</small>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0" style="min-width:820px">
          <thead class="table-light">
            <tr>
              <th style="width:20%">課程名稱</th><th style="width:22%">日期起訖</th>
              <th style="width:13%" class="text-end">學費</th><th style="width:13%" class="text-end">教材費</th>
              <th style="width:13%" class="text-end">扣除金額</th><th style="width:13%" class="text-end">總計</th><th></th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
      </div>
      <button type="button" onclick="addRow()" class="btn btn-outline-primary rounded-3 w-100 mt-3" style="border-style:dashed">
        <i class="bi bi-plus-lg me-1"></i>新增課程列
      </button>
      <div class="d-flex justify-content-end mt-3">
        <div class="bg-light rounded-3 p-3" style="min-width:260px">
          <div class="d-flex justify-content-between"><span class="text-secondary">學費小計</span><span id="s-tuition" class="fw-semibold">NT$0</span></div>
          <div class="d-flex justify-content-between"><span class="text-secondary">扣除小計</span><span id="s-deduct" class="fw-semibold text-danger">NT$0</span></div>
          <div class="d-flex justify-content-between border-top pt-2 mt-2"><span class="fw-black">應付總計</span><span id="s-total" class="fw-black text-primary fs-5">NT$0</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 備註 + 繳費 -->
  <div class="card shadow-sm rounded-4 mb-4">
    <div class="card-body p-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold small">備註（顯示於報價單）</label>
          <input name="note" id="note" class="form-control rounded-3" placeholder="例：英文班每月計8堂課">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small">繳費狀態</label>
          <select name="payment_status" class="form-select rounded-3">
            {% for st in statuses %}<option value="{{ st }}">{{ st }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small">繳費方式</label>
          <select name="payment_method" class="form-select rounded-3">
            {% for m in methods %}<option value="{{ m }}">{{ m or '─' }}</option>{% endfor %}
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button class="btn btn-primary btn-lg fw-black px-4"><i class="bi bi-check2-circle me-1"></i>建立報價單</button>
    <a href="{{ url_for('quotes') }}" class="btn btn-outline-secondary btn-lg">取消</a>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
const COURSES = {{ courses|tojson }};
const fmt = n => 'NT$' + (n||0).toLocaleString('en-US');

function pickStudent(){
  const sel = document.getElementById('student-select');
  const opt = sel.selectedOptions[0];
  document.getElementById('student-id').value = sel.value;
  if(sel.value){ document.getElementById('student-name').value = opt.dataset.name; }
}

function addRow(course){
  const tb = document.getElementById('items');
  const tr = document.createElement('tr');
  const opts = COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  tr.innerHTML = `
    <td>
      <select class="form-select form-select-sm rounded-2 mb-1" onchange="applyCourse(this)">
        <option value="">─ 選課程 ─</option>${opts}
      </select>
      <input name="item_name" class="form-control form-control-sm rounded-2" placeholder="課程名稱">
    </td>
    <td><input name="item_date" class="form-control form-control-sm rounded-2" placeholder="115/6/1-115/6/30"></td>
    <td><input name="item_tuition" type="number" class="form-control form-control-sm text-end rounded-2 calc" value="0"></td>
    <td><input name="item_material" type="number" class="form-control form-control-sm text-end rounded-2 calc" value="0"></td>
    <td><input name="item_deduction" type="number" class="form-control form-control-sm text-end rounded-2 calc" value="0"></td>
    <td class="text-end fw-semibold text-primary row-total">NT$0</td>
    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger rounded-circle px-2 py-1 lh-1" onclick="this.closest('tr').remove();recalc()"><i class="bi bi-x"></i></button></td>`;
  tb.appendChild(tr);
  tr.querySelectorAll('.calc').forEach(el => el.addEventListener('input', recalc));
  if(course){ /* reserved */ }
  recalc();
}

function applyCourse(sel){
  const c = COURSES.find(x => x.id == sel.value);
  if(!c) return;
  const tr = sel.closest('tr');
  tr.querySelector('[name=item_name]').value = c.name;
  tr.querySelector('[name=item_tuition]').value = c.default_tuition;
  tr.querySelector('[name=item_material]').value = c.default_material;
  if(c.note && !document.getElementById('note').value){ document.getElementById('note').value = c.note; }
  recalc();
}

function recalc(){
  let st=0, sd=0, stot=0;
  document.querySelectorAll('#items tr').forEach(tr => {
    const tu = +tr.querySelector('[name=item_tuition]').value || 0;
    const ma = +tr.querySelector('[name=item_material]').value || 0;
    const de = +tr.querySelector('[name=item_deduction]').value || 0;
    const tot = tu + ma - de;
    tr.querySelector('.row-total').textContent = fmt(tot);
    st += tu; sd += de; stot += tot;
  });
  document.getElementById('s-tuition').textContent = fmt(st);
  document.getElementById('s-deduct').textContent = '-' + fmt(sd);
  document.getElementById('s-total').textContent = fmt(stot);
}

addRow();
</script>
{% endblock %}
